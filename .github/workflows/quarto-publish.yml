name: Publicar libro con Quarto en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: quarto-publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar paquetes de R usados en el libro
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::car
            any::dplyr
            any::ggplot2
            any::lmtest
            any::multiColl
            any::plotly
            any::prais
            any::quantmod
            any::readxl
            any::rvif
            any::sandwich
            any::strucchange
            any::rmarkdown
            any::knitr

      # El paquete 'orcutt' fue retirado de CRAN (archivado el 2024-11-04)
      # y no se resuelve mediante los repositorios habituales; se instala
      # directamente desde el archivo de CRAN.
      - name: Instalar paquete orcutt desde el archivo de CRAN
        run: |
          Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/orcutt/orcutt_2.3.tar.gz", repos = NULL, type = "source")'

      # El libro publicado en Pages solo necesita el formato HTML;
      # se evita renderizar el PDF (xelatex) para no instalar TinyTeX en CI.
      - name: Renderizar el libro (HTML)
        run: quarto render --to html

      - name: Publicar en la rama gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
